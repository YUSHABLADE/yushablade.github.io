<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUSHABLADE | Bir Dünya Markası</title>
    <style>
        /* SIFIRLAMA VE GENEL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0b0b1a 0%, #1a1a2e 100%);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }

        /* BAŞLIK */
        .logo {
            font-size: 56px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(45deg, #f7b731, #ff6b6b, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(255, 107, 107, 0.2);
            margin-bottom: 8px;
        }

        .subtitle {
            color: #b0b0c0;
            font-size: 18px;
            letter-spacing: 6px;
            font-weight: 300;
            border-top: 1px solid rgba(255,255,255,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: inline-block;
            padding: 6px 24px;
            margin-bottom: 30px;
        }

        /* KARTLAR */
        .card-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            margin: 35px 0 45px 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 32px;
            padding: 28px 24px;
            width: 240px;
            text-decoration: none;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: scale(1.04);
            background: rgba(255, 255, 255, 0.12);
            border-color: #f7b731;
            box-shadow: 0 0 30px rgba(247, 183, 49, 0.15);
        }

        .card .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .card .title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .card .desc {
            font-size: 14px;
            color: #b0b0c0;
            font-weight: 300;
        }

        .card.youtube {
            border-color: #ff0033;
        }
        .card.youtube:hover {
            border-color: #ff0033;
            box-shadow: 0 0 30px rgba(255, 0, 51, 0.2);
        }

        .card.davet {
            border-color: #5865f2;
        }
        .card.davet:hover {
            border-color: #5865f2;
            box-shadow: 0 0 30px rgba(88, 101, 242, 0.2);
        }

        .card.ekstra {
            border-color: #00d2ff;
        }
        .card.ekstra:hover {
            border-color: #00d2ff;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.2);
        }

        /* SLOGAN */
        .slogan {
            margin-top: 20px;
            font-size: 22px;
            font-weight: 500;
            letter-spacing: 4px;
            color: #e0e0f0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 28px;
            text-transform: uppercase;
            word-spacing: 6px;
        }

        .slogan span {
            background: linear-gradient(45deg, #f7b731, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        /* MOBİL UYUM */
        @media (max-width: 600px) {
            .logo { font-size: 36px; }
            .card-grid { flex-direction: column; align-items: center; }
            .card { width: 100%; max-width: 280px; }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- BAŞLIK -->
        <div class="logo">YUSHABLADE</div>
        <div class="subtitle">BİR DÜNYA MARKASI</div>

        <!-- KARTLAR (LİNKLER) -->
        <div class="card-grid">

            <!-- YouTube Kanalı -->
            <a href="https://www.youtube.com/@YUSHABLADE" target="_blank" class="card youtube">
                <div class="icon">▶️</div>
                <div class="title">YouTube</div>
                <div class="desc">Kanalıma abone ol!</div>
            </a>

            <!-- Bot Davet Linki (GÜNCELLENDİ) -->
            <a href="https://discord.com/oauth2/authorize?client_id=1531923236999135382&permissions=8&integration_type=0&scope=bot" target="_blank" class="card davet">
                <div class="icon">🤖</div>
                <div class="title">Botu Ekle</div>
                <div class="desc">Sunucuna hemen ekle</div>
            </a>

            <!-- İleride eklemek istersen boş kart (silebilirsin) -->
            <a href="#" class="card ekstra">
                <div class="icon">⚡</div>
                <div class="title">Yakında</div>
                <div class="desc">Sürprizler geliyor</div>
            </a>

        </div>

        <!-- SLOGAN -->
        <div class="slogan">
            <span>YUSHABLADE</span> , BİR DÜNYA MARKASI !
        </div>

    </div>
</body>
</html>
