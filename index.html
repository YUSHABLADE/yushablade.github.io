<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YushaBot Dashboard | YUSHABLADE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .dash-wrap {
      min-height: calc(100vh - 70px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .dash-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .dash-card h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 2px;
      color: var(--accent);
      margin-bottom: 12px;
    }
    .dash-card p {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 28px;
    }
    .dash-back {
      display: inline-block;
      margin-top: 20px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.95rem;
    }
    .dash-back:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <header>
    <a href="../index.html" class="btn btn-outline" style="padding:10px 18px;font-size:0.95rem;margin:12px 0 0 12px;text-decoration:none">← Ana Site</a>
  </header>

  <div class="dash-wrap">
    <div class="dash-card">
      <h1>YUSHABOT DASHBOARD</h1>
      <p>
        Burası bot paneli olacak.<br>
        Discord ile giriş, sunucu ayarları ve premium özellikleri buraya eklenecek.
      </p>
      <button class="btn btn-discord" disabled style="opacity:0.6;cursor:not-allowed">
        Discord ile Giriş (Yakında)
      </button>
      <br>
      <a href="../index.html" class="dash-back">Ana siteye dön</a>
    </div>
  </div>
</body>
</html>
